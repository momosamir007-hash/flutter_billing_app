name: billing_app
description: A Flutter billing and inventory application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.6.7

  # Functional Programming
  fpdart: ^1.1.0

  # Code Generation / JSON
  json_annotation: ^4.9.0

  # Navigation
  go_router: ^14.0.0

  # Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI
  google_fonts: ^6.1.0

  # Utilities
  intl: ^0.19.0
  vibration: ^3.1.8
  uuid: ^4.5.2
  app_settings: ^7.0.0

  # Permissions
  permission_handler: ^11.3.1

  # Images
  image_picker: ^1.0.7

  # QR
  pretty_qr_code: ^3.3.0

  # Scanner
  mobile_scanner: ^5.1.0

  # Bluetooth Printer
  print_bluetooth_thermal: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # Code Generation
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
